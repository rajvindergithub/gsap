        #page2{ height: 100vh; width: 105%;  background-color: deepskyblue;}
        #page2 h1{ font-size: 40vw; text-transform: uppercase; font-family: 'Poppins'; font-weight: bold; letter-spacing: 20px;  }

<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-Qrpii3NEFZ02RN6ZqpTu6pS/5PEq7EzBYJLki3AKBd8IncrlAwQdZHzExYwS0+b1NM0/qfxI1GOhqWLVosocDA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script type="text/javascript">
    
        gsap.to("#page2 h1", {
            transform: "translateX(-150%)",
            scrollTrigger: {
                trigger : '#page2', 
                scroller: 'body',
                start: 'top 0%',
                end: 'top -150%',
                scrub: 5, 
                pin : true
            }
        });
        
    </script>

<!DOCTYPE html>
<html lang="">

<head>
	<meta charset="utf-8">
	<title>Example Title</title>
	<meta name="author" content="Your Name">
	<meta name="description" content="Example description">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="">
	<link rel="icon" type="image/x-icon" href=""/>
</head>
    
    <style type="text/css">
        
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        
        #main{ height: 100vh; width: 100%; background-color: #111; display: flex; align-items: center; justify-content: center; }
        
        #cursor{ height: 20px; width: 20px; background-color: #FFFFFF; border-radius: 50%; position: fixed; z-index: 9  }
        
        *{ margin: 0px; padding: 0px; }
        
        #image{ height: 60vh; width: 60vw; background-color: rebeccapurple; background-image: url('https://images.unsplash.com/photo-1772289935663-80aa987be656?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'); background-position: center center; background-size: cover; }
        
        
    </style>

<body>
	 <div id="cursor"> </div>
    <div id="main">
        <div id="image">
           
        </div>        
    </div>
    
    
</body>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-Qrpii3NEFZ02RN6ZqpTu6pS/5PEq7EzBYJLki3AKBd8IncrlAwQdZHzExYwS0+b1NM0/qfxI1GOhqWLVosocDA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js" integrity="sha512-HemPoJ+m4KR4XM3VY+N58XFYN7qdXuR0elHeVYGJBJ6LYC+xoeHodEpwiN5JxXLyvA+sRd7/FJ6w6lz5IkANNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script type="text/javascript">
    
        var main = document.querySelector('#main');
        var cursor = document.querySelector('#cursor');
        var imageDiv = document.querySelector('#image');
        
        main.addEventListener("mousemove", function(e){
            console.log(e.x, e.y);
            
            gsap.to(cursor, {
                x: e.x - 10,
                y: e.y - 10, 
                duration: 0.75, 
                ease: "back.out",
               
            });
            
        }); 
        
        imageDiv.addEventListener('mouseenter', function(){
            gsap.to(cursor, {
                    scale: 4,
                    
                });
        });
        
        imageDiv.addEventListener('mouseleave', function(){
             gsap.to(cursor, {
                    scale: 1,
               
                });
        });
        
    </script>
    
    

</html>

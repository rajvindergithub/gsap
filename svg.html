<!DOCTYPE html>
<html lang="">

<head>
	<meta charset="utf-8">
	<title>Example Title</title>
	<meta name="author" content="Your Name">
	<meta name="description" content="Example description">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="">
	<link rel="icon" type="image/x-icon" href=""/>
</head>
    
    <style type="text/css">
        
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        
        body{ background-color: #ccc; }
        *{ margin: 0px; padding: 0px; }
       svg path {
          
          stroke-width: 4px;
        }
        
        #string{ padding-top: 20vh; margin: auto; }
        
    </style>

<body>
	<div id="string">
        <svg width="100%" height="400"  >
            <path d="M 70 100 Q 500 100 1500 100" stroke="black" fill="transparent" />
        </svg>
    </div>

    <div id="new_line"></div>
</body>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-Qrpii3NEFZ02RN6ZqpTu6pS/5PEq7EzBYJLki3AKBd8IncrlAwQdZHzExYwS0+b1NM0/qfxI1GOhqWLVosocDA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js" integrity="sha512-HemPoJ+m4KR4XM3VY+N58XFYN7qdXuR0elHeVYGJBJ6LYC+xoeHodEpwiN5JxXLyvA+sRd7/FJ6w6lz5IkANNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script type="text/javascript">
    
        var path = `M 70 100 Q 500 100 1500 100`;
        var finalPath = `M 70 100 Q 500 100 1500 100`; 
        
        
       var string =  document.querySelector('#string');
        
//        string.addEventListener("mouseenter", function(e){
//            console.log(e);
//        });
//             
//        string.addEventListener("mouseleave", function(e){
//            console.log(e);
//        });
        
        string.addEventListener("mousemove", function(e){
            //console.log(e);
            path = `M 70 100 Q ${e.x} ${e.y} 1500 100`; 
            
            
            gsap.to('#string svg path', {
                attr: {d: path},
                duration: 0.3, 
                ease: 'power3.out'
            });
            
            
            
        });
        
        
        string.addEventListener("mouseleave", function(e){
            //console.log(e);
            
            
            gsap.to('#string svg path', {
                attr: {d: finalPath},
                duration: 2, 
                ease: 'elastic.out(1, 0.2)'
            });
            
            
            
        });
        
        
    </script>
    
    

</html>
